site_name: 程序员的自我修养
site_description: 链接、装载与库——从源代码到程序运行
site_url: https://yus3nable.github.io/programmer-self-cultivation-reading/
use_directory_urls: false
strict: true
theme:
  name: material
  language: zh
  font: false
  icon:
    logo: material/code-braces
  palette:
    - scheme: default
      primary: white
      toggle:
        icon: material/weather-night
        name: 切换至深色模式
    - scheme: slate
      primary: black
      toggle:
        icon: material/weather-sunny
        name: 切换至浅色模式
  features:
    - navigation.indexes
    - navigation.footer
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
plugins:
  - search:
      lang: zh
markdown_extensions:
  - md_in_html
  - tables
  - attr_list
  - footnotes
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
extra_css:
  - styles/reader.css
extra:
  generator: false
